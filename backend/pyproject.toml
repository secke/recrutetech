[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.98.0",
    "elevenlabs==1.9.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "pydantic-settings==2.6.0",
    "pydantic[email]==2.9.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
    "pypdf>=5.1,<6.0",
    "python-docx>=1.1",
    "sqlmodel==0.0.22",
    "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
