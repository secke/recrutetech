# alembic.ini — Alembic configuration for RecruteTech
# This file lives at backend/alembic.ini (run alembic from inside backend/).

[alembic]
# Path to migration scripts, relative to this ini file.
script_location = alembic

# Template used for new revision files.
file_template = %%(rev)s_%%(slug)s

# Timezone for generated migration timestamps.
timezone = UTC

# sys.path prepend — ensures `app` package is importable when running alembic.
prepend_sys_path = .

# Logging configuration (standard Python logging ini format below).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
