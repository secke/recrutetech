<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RecruteTech · Aria — AI Interview Platform</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0eee9; }
  #root { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screens/PreInterview.jsx"></script>
<script type="text/babel" src="screens/LiveInterview.jsx"></script>
<script type="text/babel" src="screens/LiveCoding.jsx"></script>
<script type="text/babel" src="screens/Summary.jsx"></script>
<script type="text/babel" src="screens/HRDashboard.jsx"></script>
<script type="text/babel" src="screens/HRDetail.jsx"></script>
<script type="text/babel" src="screens/InterviewConfig.jsx"></script>

<script type="text/babel" data-presets="react">
const DEFAULTS = /*EDITMODE-BEGIN*/{
  "language": "fr",
  "theme": "light"
}/*EDITMODE-END*/;

function App() {
  const tweaks = useTweaks(DEFAULTS);
  const { values, set } = tweaks;
  const lang = values.language;
  const theme = values.theme;

  return (
    <>
      <DesignCanvas>
        <DCSection id="candidate" title={lang === "fr" ? "Parcours Candidat" : "Candidate Flow"}
                   subtitle={lang === "fr" ? "De la préparation au feedback — l'expérience vue par le candidat" : "From prep to feedback — experience through the candidate's eyes"}>
          <DCArtboard id="pre" label={lang === "fr" ? "1 · Préparation" : "1 · Setup"} width={1280} height={820}>
            <PreInterview lang={lang} theme={theme} />
          </DCArtboard>
          <DCArtboard id="live" label={lang === "fr" ? "2 · Entretien en direct" : "2 · Live interview"} width={1280} height={820}>
            <LiveInterview lang={lang} theme={theme} />
          </DCArtboard>
          <DCArtboard id="code" label={lang === "fr" ? "3 · Défi de code" : "3 · Coding challenge"} width={1280} height={820}>
            <LiveCoding lang={lang} theme={theme} />
          </DCArtboard>
          <DCArtboard id="summary" label={lang === "fr" ? "4 · Merci" : "4 · Thank you"} width={1280} height={820}>
            <Summary lang={lang} theme={theme} />
          </DCArtboard>
        </DCSection>

        <DCSection id="hr" title={lang === "fr" ? "Espace RH / Entreprise" : "HR / Company Workspace"}
                   subtitle={lang === "fr" ? "Pilotage des entretiens, rapports Aria et configuration" : "Manage interviews, Aria reports, and templates"}>
          <DCArtboard id="dashboard" label={lang === "fr" ? "Tableau de bord" : "Dashboard"} width={1280} height={820}>
            <HRDashboard lang={lang} theme={theme} />
          </DCArtboard>
          <DCArtboard id="detail" label={lang === "fr" ? "Rapport candidat" : "Candidate report"} width={1280} height={820}>
            <HRDetail lang={lang} theme={theme} />
          </DCArtboard>
          <DCArtboard id="config" label={lang === "fr" ? "Configurer un entretien" : "Configure interview"} width={1280} height={820}>
            <InterviewConfig lang={lang} theme={theme} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title={lang === "fr" ? "Langue & thème" : "Language & theme"}>
          <TweakRadio
            label={lang === "fr" ? "Langue" : "Language"}
            value={lang}
            onChange={v => set({ language: v })}
            options={[
              { value: "fr", label: "Français" },
              { value: "en", label: "English" },
            ]}
          />
          <TweakRadio
            label={lang === "fr" ? "Thème" : "Theme"}
            value={theme}
            onChange={v => set({ theme: v })}
            options={[
              { value: "light", label: lang === "fr" ? "Clair" : "Light" },
              { value: "dark", label: lang === "fr" ? "Sombre" : "Dark" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
