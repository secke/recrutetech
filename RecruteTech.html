<style>
/* ── RecruteTech / Aria — warm & human design tokens ── */
:root {
  --bg: #FBF7F2;
  --bg-deep: #F5EEE3;

  --surface-raised: #FFFDFA;
  --ink: #1F1B16;
  --ink-2: #3A342D;

  --border: #E8E0D4;
  --border-strong: #D6CBBA;

  --terracotta: #E8734A;
  --terracotta-deep: #C85A34;
  --terracotta-soft: #F4D9CE;
  --sage: #2E5D4F;
  --sage-soft: #D9E5DF;
  --sand: #EFE5D4;
  --butter: #F2D9A0;
  --plum: #6B4A5C;

  --success: #2E5D4F;
  --warning: #B8732B;
  --danger: #B94A3B;

  --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', monospace;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(31, 27, 22, 0.04), 0 1px 3px rgba(31, 27, 22, 0.06);
  --shadow-md: 0 4px 14px rgba(31, 27, 22, 0.06), 0 2px 6px rgba(31, 27, 22, 0.04);
  --shadow-lg: 0 24px 60px rgba(31, 27, 22, 0.10), 0 8px 20px rgba(31, 27, 22, 0.06);
}

[data-theme="dark"] {
  --bg: #1A1612;
  --bg-deep: #120F0C;
  --surface: #231E19;
  --surface-raised: #2A241E;
  --ink: #F5EEE3;
  --ink-2: #E8DFD0;
  --muted: #A89E90;
  --muted-2: #80776C;
  --border: #3A332B;
  --border-strong: #4A4238;
  --terracotta-soft: #3E241B;
  --sage-soft: #1E2D26;
  --sand: #2E261B;
}

* { box-sizing: border-box; }

body, .rt-root {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11";
}

.rt-serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; }

.rt-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.rt-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  padding: 10px 18px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 180ms ease;
  white-space: nowrap;
}
.rt-btn-primary { background: var(--ink); color: var(--bg); }
.rt-btn-primary:hover { background: var(--ink-2); }
.rt-btn-accent { background: var(--terracotta); color: #FFF; }
.rt-btn-accent:hover { background: var(--terracotta-deep); }
.rt-btn-ghost { background: transparent; color: var(--ink); border-color: var(--border-strong); }
.rt-btn-ghost:hover { background: var(--surface); }

.rt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }

.rt-focus:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; }

@keyframes aria-breathe {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.04) rotate(3deg); }
}
@keyframes aria-morph {
  0%, 100% { border-radius: 58% 42% 60% 40% / 45% 55% 45% 55%; }
  33% { border-radius: 42% 58% 45% 55% / 60% 40% 60% 40%; }
  66% { border-radius: 50% 50% 55% 45% / 55% 45% 50% 50%; }
}
.aria-orb-core {
  animation: aria-morph 7s ease-in-out infinite, aria-breathe 4s ease-in-out infinite;
}

.rt-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.rt-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.rt-scroll::-webkit-scrollbar-track { background: transparent; }

@keyframes wave-bar {
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(1); }
}

.rt-code { font-family: var(--mono); font-size: 13px; line-height: 1.65; }

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0eee9; }
#root { width: 100%; height: 100vh; }

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- ══ design-canvas.jsx ══════════════════════════════════════════════════════ -->
<script type="text/babel" data-presets="react">
// DesignCanvas — Figma-ish design canvas wrapper
const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  const registry = {};
  const sectionMeta = {};
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return;
      if (e.ctrlKey) {
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div ref={vpRef} className="design-canvas" style={{
      height: '100vh', width: '100vw',
      background: DC.bg,
      overflow: 'hidden',
      overscrollBehavior: 'none',
      touchAction: 'none',
      position: 'relative',
      fontFamily: DC.font,
      boxSizing: 'border-box',
      ...style,
    }}>
      <div ref={worldRef} style={{
        position: 'absolute', top: 0, left: 0,
        transformOrigin: '0 0',
        willChange: 'transform',
        width: 'max-content', minWidth: '100%',
        minHeight: '100%',
        padding: '60px 0 80px',
      }}>
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">
          <svg width="9" height="13" viewBox="0 0 9 13" fill="currentColor"><circle cx="2" cy="2" r="1.1"/><circle cx="7" cy="2" r="1.1"/><circle cx="2" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="2" cy="11" r="1.1"/><circle cx="7" cy="11" r="1.1"/></svg>
        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

function DCEditable({ value, onChange, style, tag = 'span', onClick }) {

function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

    <div onClick={() => ctx.setFocus(null)}

        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>

          </button>

              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>

        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>

              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />

<script type="text/babel" data-presets="react">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;

  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;

  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}

  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;height:22px;
    border-radius:6px;cursor:default;padding:0}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const set = React.useCallback((partial) => {
    setValues((prev) => ({ ...prev, ...partial }));
  }, []);
  return { values, set };
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title, label, children }) {
  return (
    <>
      <div className="twk-sect">{title || label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow, TweakRadio,
});
</script>

function AriaOrb({ size = 120, state = "idle", palette = "warm" }) {
  const palettes = {
    warm: { a: "#F4A781", b: "#E8734A", c: "#C85A34", glow: "rgba(232,115,74,0.35)" },
    sage: { a: "#A8C7B8", b: "#2E5D4F", c: "#1F4236", glow: "rgba(46,93,79,0.35)" },
    plum: { a: "#C999A8", b: "#6B4A5C", c: "#4A3341", glow: "rgba(107,74,92,0.35)" },
  };
  const p = palettes[palette] || palettes.warm;
  const intensity = state === "speaking" ? 1 : state === "listening" ? 0.5 : state === "thinking" ? 0.7 : 0.3;
  const speed = state === "speaking" ? "2.2s" : state === "thinking" ? "3s" : "5s";
  const innerId = useMemo(() => "orb-" + Math.random().toString(36).slice(2, 8), []);

  return (
    <div style={{ position: "relative", width: size, height: size, display: "grid", placeItems: "center" }}>
      <div style={{
        position: "absolute",
        inset: -size * 0.15,
        borderRadius: "50%",
        background: `radial-gradient(circle, ${p.glow} 0%, transparent 65%)`,
        opacity: intensity,
        animation: `aria-breathe ${speed} ease-in-out infinite`,
      }} />
      <div className="aria-orb-core" style={{
        width: size * 0.82,
        height: size * 0.82,
        background: `radial-gradient(circle at 30% 30%, ${p.a}, ${p.b} 55%, ${p.c} 100%)`,
        boxShadow: `inset -${size * 0.08}px -${size * 0.12}px ${size * 0.2}px rgba(0,0,0,0.25), inset ${size * 0.06}px ${size * 0.06}px ${size * 0.15}px rgba(255,255,255,0.35)`,
        animationDuration: `${7}s, ${speed}`,
      }} />
      {state === "speaking" && (
        <div style={{
          position: "absolute", bottom: size * 0.22, left: "50%", transform: "translateX(-50%)",
          display: "flex", alignItems: "flex-end", gap: 3, height: size * 0.2,
        }}>
          {[0, 1, 2, 3, 4].map((i) => (
            <div key={i} style={{
              width: size * 0.03, height: "100%",
              background: "rgba(255,255,255,0.85)",
              borderRadius: 999, transformOrigin: "bottom",
              animation: `wave-bar 0.9s ease-in-out ${i * 0.12}s infinite`,
            }} />
          ))}
        </div>
      )}
      {state === "thinking" && (
        <div style={{
          position: "absolute", bottom: size * 0.28, left: "50%", transform: "translateX(-50%)",
          display: "flex", gap: 4,
        }}>
          {[0, 1, 2].map((i) => (
            <div key={i} style={{

              animation: `wave-bar 1.2s ease-in-out ${i * 0.2}s infinite`,
            }} />
          ))}
        </div>
      )}
    </div>
  );
}

function CodeBlock() {
  const lines = [
    { n: 1, tokens: [{ t: "keyword", v: "function" }, { t: "fn", v: " groupAnagrams" }, { t: "punc", v: "(" }, { t: "param", v: "words" }, { t: "punc", v: ") {" }] },
    { n: 2, tokens: [{ t: "tab", v: "  " }, { t: "keyword", v: "const" }, { t: "var", v: " groups" }, { t: "op", v: " = " }, { t: "keyword", v: "new" }, { t: "type", v: " Map" }, { t: "punc", v: "();" }] },
    { n: 3, tokens: [] },
    { n: 4, tokens: [{ t: "tab", v: "  " }, { t: "keyword", v: "for" }, { t: "punc", v: " (" }, { t: "keyword", v: "const" }, { t: "var", v: " word" }, { t: "keyword", v: " of" }, { t: "var", v: " words" }, { t: "punc", v: ") {" }] },
    { n: 5, tokens: [{ t: "tab", v: "    " }, { t: "comment", v: "// canonical signature: sorted chars" }] },
    { n: 6, tokens: [{ t: "tab", v: "    " }, { t: "keyword", v: "const" }, { t: "var", v: " key" }, { t: "op", v: " = " }, { t: "var", v: "word" }, { t: "punc", v: "." }, { t: "fn", v: "split" }, { t: "punc", v: "(" }, { t: "str", v: "''" }, { t: "punc", v: ")." }, { t: "fn", v: "sort" }, { t: "punc", v: "()." }, { t: "fn", v: "join" }, { t: "punc", v: "(" }, { t: "str", v: "''" }, { t: "punc", v: ");" }] },
    { n: 7, tokens: [] },
    { n: 8, tokens: [{ t: "tab", v: "    " }, { t: "keyword", v: "if" }, { t: "punc", v: " (!" }, { t: "var", v: "groups" }, { t: "punc", v: "." }, { t: "fn", v: "has" }, { t: "punc", v: "(" }, { t: "var", v: "key" }, { t: "punc", v: ")) {" }] },
    { n: 9, tokens: [{ t: "tab", v: "      " }, { t: "var", v: "groups" }, { t: "punc", v: "." }, { t: "fn", v: "set" }, { t: "punc", v: "(" }, { t: "var", v: "key" }, { t: "punc", v: ", []);" }] },
    { n: 10, tokens: [{ t: "tab", v: "    " }, { t: "punc", v: "}" }] },
    { n: 11, tokens: [] },
    { n: 12, tokens: [{ t: "tab", v: "    " }, { t: "var", v: "groups" }, { t: "punc", v: "." }, { t: "fn", v: "get" }, { t: "punc", v: "(" }, { t: "var", v: "key" }, { t: "punc", v: ")." }, { t: "fn", v: "push" }, { t: "punc", v: "(" }, { t: "var", v: "word" }, { t: "punc", v: ");" }] },
    { n: 13, tokens: [{ t: "tab", v: "  " }, { t: "punc", v: "}" }] },
    { n: 14, tokens: [] },
    { n: 15, tokens: [{ t: "tab", v: "  " }, { t: "keyword", v: "return" }, { t: "type", v: " Array" }, { t: "punc", v: "." }, { t: "fn", v: "from" }, { t: "punc", v: "(" }, { t: "var", v: "groups" }, { t: "punc", v: "." }, { t: "fn", v: "values" }, { t: "punc", v: "());" }] },
    { n: 16, tokens: [{ t: "punc", v: "}" }] },
  ];
  const colors = { keyword: "#E8A478", fn: "#F4D9CE", param: "#C8B89E", var: "#E8DFD0", type: "#A8C7B8", punc: "#6B635A", op: "#C8B89E", str: "#E8C9B4", comment: "#6B635A", tab: "#6B635A" };
  return (
    <div style={{ display: "flex", width: "100%" }} className="rt-code">
      <div style={{ padding: "14px 14px 14px 18px", color: "#6B635A", fontFamily: "var(--mono)", fontSize: 12, userSelect: "none", borderRight: "1px solid #2A241E", background: "#1A1712" }}>
        {lines.map(l => <div key={l.n} style={{ lineHeight: "1.7em", textAlign: "right" }}>{l.n}</div>)}
      </div>
      <div style={{ padding: "14px 18px", fontFamily: "var(--mono)", fontSize: 13, flex: 1, overflowX: "auto" }}>
        {lines.map(l => (
          <div key={l.n} style={{ lineHeight: "1.7em", whiteSpace: "pre" }}>
            {l.tokens.length === 0 ? " " : l.tokens.map((tok, i) => (
              <span key={i} style={{ color: colors[tok.t] || "#E8DFD0", fontStyle: tok.t === "comment" ? "italic" : "normal" }}>{tok.v}</span>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { LiveCoding });
</script>

function Summary({ lang = "fr", theme = "light" }) {

                <div style={{ display: "flex", gap: 6, marginTop: 10 }}>

            <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 22, padding: 20, display: "flex", alignItems: "center", gap: 18 }}>

              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{S.hr_score}</div>

            </div>
          </div>
          <div style={{ padding: "0 32px 24px" }}>
            <div style={{ background: "var(--terracotta-soft)", borderRadius: 22, padding: "22px 26px", border: "1px solid rgba(232,115,74,0.18)", display: "flex", gap: 18, alignItems: "flex-start" }}>
              <AriaOrb size={40} state="idle" />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "var(--terracotta-deep)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6 }}>{lang === "fr" ? "Synthèse d'Aria" : "Aria's summary"}</div>
                <p className="rt-serif" style={{ fontSize: 22, lineHeight: 1.35, margin: 0, color: "var(--ink)", maxWidth: 860 }}>
                  {lang === "fr" ? "Excellente candidate avec une maturité technique confirmée. Communication très claire, bonne intuition système. À creuser : gestion fine des cas limites sous pression." : "Excellent candidate with confirmed technical maturity. Very clear communication, strong systems intuition. Explore further: handling fine edge cases under pressure."}
                </p>
              </div>
            </div>
          </div>
          <div style={{ padding: "0 32px 32px", display: "grid", gridTemplateColumns: "1fr 1.1fr", gap: 20 }}>

              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>

                <div style={{ display: "flex", gap: 6 }}>

                  <button style={{ ...pillBtn, background: "var(--ink)", color: "var(--bg)", border: "1px solid var(--ink)" }}>{lang === "fr" ? "Vidéo" : "Video"}</button>

                <div style={{ position: "absolute", inset: "25% 12px", display: "flex", alignItems: "center", gap: 2 }}>

                    const h = 20 + Math.abs(Math.sin(i * 0.7) * 30) + Math.abs(Math.cos(i * 0.33) * 15);
                    return <div key={i} style={{ flex: 1, height: h + "%", background: "rgba(244,217,206,0.7)", borderRadius: 1 }} />;
                  })}
                </div>
                <div style={{ position: "absolute", top: 0, bottom: 0, left: "32%", width: 2, background: "var(--terracotta)", boxShadow: "0 0 12px var(--terracotta)" }} />

              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {moments.map((m, i) => <MomentRow key={i} m={m} />)}
              </div>

          </div>
        </div>
      </div>
    </div>
  );
}

function SkillBar({ label, value }) {
  const color = value >= 85 ? "var(--sage)" : value >= 70 ? "var(--terracotta)" : "#B94A3B";
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span style={{ fontSize: 13, color: "var(--ink-2)" }}>{label}</span>
        <span style={{ fontSize: 12, color: "var(--ink)", fontWeight: 500, fontVariantNumeric: "tabular-nums" }}>{value}</span>
      </div>
      <div style={{ height: 6, borderRadius: 999, background: "var(--bg-deep)", overflow: "hidden" }}>
        <div style={{ width: value + "%", height: "100%", background: color, borderRadius: 999 }} />
      </div>
    </div>
  );
}

function MomentRow({ m }) {
  const colors = { sage: { bg: "var(--sage-soft)", fg: "var(--sage)" }, butter: { bg: "#F5EBD2", fg: "#8F6B1E" }, plum: { bg: "#EADFE6", fg: "var(--plum)" } };
  const c = colors[m.color];
  return (
    <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 12, alignItems: "center", padding: "8px 12px", borderRadius: 12, background: "var(--bg)", border: "1px solid var(--border)", cursor: "pointer" }}>
      <span style={{ fontFamily: "var(--mono)", fontSize: 11, color: "var(--muted)", padding: "2px 8px", borderRadius: 6, background: "var(--bg-deep)" }}>{m.t}</span>
      <span style={{ fontSize: 13, color: "var(--ink-2)" }}>{m.q}</span>
      <span className="rt-pill" style={{ background: c.bg, color: c.fg }}>{m.tag}</span>
    </div>
  );
}

Object.assign(window, { HRDetail });
</script>

<!-- ══ screens/InterviewConfig.jsx ═══════════════════════════════════════════ -->
<script type="text/babel" data-presets="react">
function InterviewConfig({ lang = "fr", theme = "light" }) {
  const S = STRINGS[lang];
  const [role, setRole] = React.useState("Senior Backend Engineer");
  const [duration, setDuration] = React.useState(45);
  const [seniority, setSeniority] = React.useState("senior");
  const [stages, setStages] = React.useState(["intro", "experience", "technical", "code"]);
  const [skills, setSkills] = React.useState(["Python", "PostgreSQL", "System design"]);
  const [tone, setTone] = React.useState("warm");
  const [cfgLang, setCfgLang] = React.useState(lang);

  const allStages = [
    { k: "intro", label: lang === "fr" ? "Présentation" : "Introduction", min: 5 },
    { k: "experience", label: lang === "fr" ? "Expérience" : "Experience", min: 10 },
    { k: "technical", label: lang === "fr" ? "Technique" : "Technical", min: 15 },
    { k: "code", label: lang === "fr" ? "Code review" : "Code review", min: 10 },
    { k: "challenge", label: lang === "fr" ? "Live coding" : "Live coding", min: 25 },
    { k: "questions", label: lang === "fr" ? "Questions candidat" : "Candidate questions", min: 5 },
  ];
  const toggleStage = (k) => setStages(s => s.includes(k) ? s.filter(x => x !== k) : [...s, k]);

  const allSkills = ["Python", "JavaScript", "TypeScript", "Go", "Rust", "PostgreSQL", "Redis", "Kafka", "System design", "Distributed systems", "React", "Node.js", "AWS", "Kubernetes", "ML"];
  const toggleSkill = (s) => setSkills(ss => ss.includes(s) ? ss.filter(x => x !== s) : [...ss, s]);

  const inputStyle = { width: "100%", padding: "11px 14px", borderRadius: 12, border: "1px solid var(--border)", background: "var(--surface)", fontSize: 14, fontFamily: "inherit", color: "var(--ink)", outline: "none" };

  return (
    <div data-theme={theme} className="rt-root" style={{ width: 1280, height: 820, background: "var(--bg)", display: "grid", gridTemplateColumns: "224px 1fr", fontFamily: "var(--sans)" }}>
      <SideNav lang={lang} active="configs" />
      <div style={{ display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <div style={{ padding: "22px 32px", borderBottom: "1px solid var(--border)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <h1 className="rt-serif" style={{ fontSize: 30, margin: 0, letterSpacing: "-0.01em" }}>{S.cfg_title}</h1>
            <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 4 }}>{lang === "fr" ? "Aria suivra ce plan pour chaque candidat du même poste." : "Aria will follow this plan for every candidate for this role."}</div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button className="rt-btn rt-btn-ghost">{S.cfg_preview}</button>
            <button className="rt-btn rt-btn-accent"><CheckIcon size={13} /> {S.cfg_publish}</button>
          </div>
        </div>
        <div style={{ flex: 1, overflowY: "auto", display: "grid", gridTemplateColumns: "1fr 360px" }} className="rt-scroll">
          <div style={{ padding: "28px 32px", display: "flex", flexDirection: "column", gap: 22 }}>
            <CfgField label={S.cfg_role}>
              <input value={role} onChange={e => setRole(e.target.value)} style={inputStyle} />
            </CfgField>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
              <CfgField label={S.cfg_seniority}>
                <div style={{ display: "flex", gap: 6 }}>
                  {[{ k: "junior", label: "Junior" }, { k: "mid", label: "Mid" }, { k: "senior", label: "Senior" }, { k: "staff", label: "Staff" }].map(s => (
                    <CfgChip key={s.k} active={seniority === s.k} onClick={() => setSeniority(s.k)}>{s.label}</CfgChip>
                  ))}
                </div>
              </CfgField>
              <CfgField label={S.cfg_language}>
                <div style={{ display: "flex", gap: 6 }}>
                  <CfgChip active={cfgLang === "fr"} onClick={() => setCfgLang("fr")}>🇫🇷 Français</CfgChip>
                  <CfgChip active={cfgLang === "en"} onClick={() => setCfgLang("en")}>🇬🇧 English</CfgChip>
                  <CfgChip active={false}>+ {lang === "fr" ? "Ajouter" : "Add"}</CfgChip>
                </div>
              </CfgField>
            </div>
            <CfgField label={`${S.cfg_duration} — ${duration} ${S.pre_minutes}`}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <input type="range" min={15} max={90} step={5} value={duration} onChange={e => setDuration(+e.target.value)} style={{ flex: 1, accentColor: "var(--terracotta)" }} />
                <div style={{ fontSize: 11, color: "var(--muted)" }}>15 – 90 {S.pre_minutes}</div>
              </div>
            </CfgField>
            <CfgField label={S.cfg_stages} hint={lang === "fr" ? "Glissez pour réordonner" : "Drag to reorder"}>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {allStages.map(s => {
                  const active = stages.includes(s.k);
                  const idx = stages.indexOf(s.k);
                  return (
                    <div key={s.k} onClick={() => toggleStage(s.k)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 14px", background: active ? "var(--surface)" : "var(--bg-deep)", border: "1px solid " + (active ? "var(--border)" : "transparent"), borderRadius: 12, cursor: "pointer", opacity: active ? 1 : 0.55 }}>
                      <span style={{ width: 22, height: 22, borderRadius: 999, background: active ? "var(--terracotta)" : "var(--border)", color: "#FFF", display: "grid", placeItems: "center", fontSize: 10, fontWeight: 600 }}>
                        {active ? idx + 1 : "·"}
                      </span>
                      <span style={{ flex: 1, fontSize: 13, fontWeight: 500, color: "var(--ink)" }}>{s.label}</span>
                      <span style={{ fontSize: 11, color: "var(--muted)" }}>~{s.min} {S.pre_minutes}</span>
                      <span style={{ color: "var(--muted)", cursor: "grab" }}>
                        <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="2" r="1.2"/><circle cx="8" cy="2" r="1.2"/><circle cx="2" cy="7" r="1.2"/><circle cx="8" cy="7" r="1.2"/><circle cx="2" cy="12" r="1.2"/><circle cx="8" cy="12" r="1.2"/></svg>
                      </span>
                    </div>
                  );
                })}
              </div>
            </CfgField>
            <CfgField label={S.cfg_skills} hint={`${skills.length} ${lang === "fr" ? "sélectionnées" : "selected"}`}>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {allSkills.map(s => <CfgChip key={s} active={skills.includes(s)} onClick={() => toggleSkill(s)}>{s}</CfgChip>)}
              </div>
            </CfgField>
            <CfgField label={S.cfg_tone}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                {[
                  { k: "warm", label: lang === "fr" ? "Chaleureux" : "Warm", d: lang === "fr" ? "Accueillant, rassurant" : "Welcoming, reassuring" },
                  { k: "neutral", label: lang === "fr" ? "Neutre" : "Neutral", d: lang === "fr" ? "Professionnel, direct" : "Professional, direct" },
                  { k: "rigorous", label: lang === "fr" ? "Rigoureux" : "Rigorous", d: lang === "fr" ? "Exigeant, précis" : "Demanding, precise" },
                ].map(t => (
                  <div key={t.k} onClick={() => setTone(t.k)} style={{ padding: 14, borderRadius: 14, background: tone === t.k ? "var(--terracotta-soft)" : "var(--surface)", border: "1px solid " + (tone === t.k ? "var(--terracotta)" : "var(--border)"), cursor: "pointer" }}>
                    <div style={{ fontSize: 13, fontWeight: 500, color: "var(--ink)" }}>{t.label}</div>
                    <div style={{ fontSize: 11, color: "var(--muted)", marginTop: 3 }}>{t.d}</div>
                  </div>
                ))}
              </div>
            </CfgField>
          </div>
          <div style={{ padding: "28px 32px 28px 0" }}>
            <div style={{ position: "sticky", top: 0, background: "var(--bg-deep)", borderRadius: 22, padding: 22, border: "1px solid var(--border)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
                <AriaOrb size={44} state="speaking" />
                <div>
                  <div style={{ fontSize: 12, fontWeight: 600 }}>Aria</div>
                  <div style={{ fontSize: 10.5, color: "var(--muted)" }}>{lang === "fr" ? "Aperçu du ton" : "Tone preview"}</div>
                </div>
              </div>
              <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 14, padding: 14 }}>
                <p className="rt-serif" style={{ fontSize: 17, lineHeight: 1.4, margin: 0, fontStyle: "italic", color: "var(--ink)" }}>
                  "{tone === "warm"
                    ? (cfgLang === "fr" ? "Bonjour ! Je suis Aria. Prenez votre temps, il n'y a pas de mauvaises réponses — juste une conversation." : "Hi there! I'm Aria. Take your time — there are no wrong answers, just a conversation.")
                    : tone === "neutral"
                    ? (cfgLang === "fr" ? "Bonjour. Je suis Aria, je vais conduire votre entretien. Commençons par votre parcours." : "Hello. I'm Aria, I'll be conducting your interview. Let's start with your background.")
                    : (cfgLang === "fr" ? "Bonjour. Entretien technique rigoureux, 45 minutes. Présentez-vous en 90 secondes." : "Hello. Rigorous technical interview, 45 minutes. Introduce yourself in 90 seconds.")
                  }"
                </p>
              </div>
              <div style={{ marginTop: 18, fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>{lang === "fr" ? "Résumé" : "Summary"}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <CfgSummaryRow k={S.cfg_role} v={role} />
                <CfgSummaryRow k={S.cfg_seniority} v={seniority} />
                <CfgSummaryRow k={S.cfg_duration} v={`${duration} ${S.pre_minutes}`} />
                <CfgSummaryRow k={S.cfg_stages} v={`${stages.length} ${lang === "fr" ? "étapes" : "stages"}`} />
                <CfgSummaryRow k={S.cfg_skills} v={`${skills.length} ${lang === "fr" ? "compétences" : "skills"}`} />
                <CfgSummaryRow k={S.cfg_language} v={cfgLang === "fr" ? "Français" : "English"} />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function CfgField({ label, hint, children }) {
  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
        <label style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-2)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</label>
        {hint && <span style={{ fontSize: 11, color: "var(--muted)" }}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

function CfgChip({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{ padding: "7px 13px", borderRadius: 999, border: "1px solid " + (active ? "var(--ink)" : "var(--border)"), background: active ? "var(--ink)" : "var(--surface)", color: active ? "var(--bg)" : "var(--ink-2)", fontSize: 12.5, fontWeight: 500, cursor: "pointer", fontFamily: "inherit" }}>{children}</button>
  );
}

function CfgSummaryRow({ k, v }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
      <span style={{ color: "var(--muted)" }}>{k}</span>
      <span style={{ color: "var(--ink)", fontWeight: 500, textTransform: "capitalize" }}>{v}</span>
    </div>
  );
}

Object.assign(window, { InterviewConfig });
</script>

              { value: "light", label: lang === "fr" ? "Clair" : "Light" },
              { value: "dark", label: lang === "fr" ? "Sombre" : "Dark" },
            ]}
          />

      </TweaksPanel>
    </>

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
